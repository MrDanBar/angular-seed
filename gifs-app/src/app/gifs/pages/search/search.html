<h2 class="text-2xl font-bold mt-5">Search Gifs</h2>
<h2 class="text-sm text-gray-500">Search by name, description or any</h2>
<section class="flex flex-col gap-4">
  <input type="text" placeholder="Search gifs..." class="mt-3 border border-amber-950 rounded-md p-2"
    (keyup.enter)="onSearch(txtSearch.value)" #txtSearch />
</section>

<section class="py-5">
  <gift-item-list [list]="gifs()" />
</section>
