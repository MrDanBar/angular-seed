<h3>List</h3>
<ul>
  @for (item of characters(); track item.id; ) {
    <li>
    @if (item.power > 5000) {
      <span>{{ item.name }} </span>
      <strong
        [class.text-danger]="item.power > 50000"
        [class.text-primary]="item.power >= 15000">
        ({{ item.power }})</strong>
      <a> {{ item.id }}</a>

    } @else {
      <span class="text-warning"> Hidden - power too low </span>
    }
    </li>
  }
</ul>
