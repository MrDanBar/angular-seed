@for (region of regions; track region) {
<button class="btn btn-outline mr-2 w-25" (click)="selectedRegion.set(region)"
  [class.btn-primary]="selectedRegion() === region">
  {{ region }}
</button>
}
@if (countryResource.error()?.message) {
<app-error-tile [tile]="countryResource.error()?.message!" />
} @else {
<country-list-display [list]="countryResource.value()" [isLoading]="countryResource.isLoading()" />
}
