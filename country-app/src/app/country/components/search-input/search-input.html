<div class="flex flex-row gap-2">
  <input type="text" class="input input-bordered mr-2 w-60"
  [placeholder]="placeHolder()",
  autofocus
  (keyup.enter)="onSearch(txtSearch.value)"
  #txtSearch/>

  <button class="btn btn-primary" (click)="onSearch(txtSearch.value)">
    Search
  </button>

</div>
